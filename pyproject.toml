[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solace"
version = "0.1.0"
description = "Orbital debris conjunction screening, Whipple-shield impact modelling and space-hardware risk forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # PyTorch 2.2.2 (the last build for Intel Macs) is compiled against NumPy 1.x.
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "sgp4>=2.22",
    "requests>=2.31",
    "plotly>=5.18",
    "pymsis>=0.10",
]

[project.optional-dependencies]
ml = ["torch>=2.1"]
live = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "skyfield>=1.48", "pandas>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
solace = "solace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]  # zip(strict=) adds noise where lengths are equal by construction
